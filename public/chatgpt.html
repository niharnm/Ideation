<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>NimGTP</title>
    <style>
      :root {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #ececec;
        background: #212121;
        font-weight: 400;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #212121; }
      button, textarea, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      a { color: inherit; text-decoration: none; }
      button:focus-visible, a:focus-visible {
        outline: 1px solid #8f8f8f;
        outline-offset: 1px;
      }
      textarea:focus, input:focus { outline: none; }
      .app {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        min-height: 100%;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        padding: 8px 6px 10px;
        background: #171717;
        color: #ececec;
      }
      .side-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 34px;
        padding: 0 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #ececec;
        font-size: 13px;
        font-weight: 400;
        text-align: left;
      }
      .side-btn:hover, .recent:hover { background: #212121; }
      .side-btn svg, .recent svg { width: 16px; height: 16px; flex: 0 0 auto; opacity: .85; }
      .new-chat { margin-bottom: 4px; }
      .side-nav { display: grid; gap: 1px; }
      .side-nav .side-btn { color: #cfcfcf; }
      .recents-label {
        margin: 14px 8px 4px;
        color: #8f8f8f;
        font-size: 11px;
        font-weight: 500;
      }
      .recents {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 1px;
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
      }
      .recent {
        display: block;
        flex: 0 0 auto;
        width: 100%;
        height: auto;
        padding: 8px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #ececec;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.35;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .recent.is-active { background: #212121; }
      .profile {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
        padding: 6px 8px;
        border-radius: 8px;
      }
      .profile:hover { background: #212121; }
      .avatar-sm {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #5b5bd6;
        font-size: 10px;
        font-weight: 600;
      }
      .profile span { font-size: 13px; }
      .profile small { display: block; color: #8f8f8f; font-size: 11px; font-weight: 400; }
      .stage {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
      }
      .model {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
      }
      .model:hover { background: #2f2f2f; }
      .share {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #ececec;
      }
      .share:hover { background: #2f2f2f; }
      .thread { overflow: auto; }
      .thread-inner { width: min(100% - 24px, 768px); margin: 0 auto; padding: 8px 0 20px; }
      .empty { text-align: center; padding: 16vh 0 6vh; }
      .empty h1 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: -0.03em; }
      .suggestions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 20px auto 0;
        max-width: 640px;
        text-align: left;
      }
      .suggestion {
        min-height: 48px;
        padding: 10px 12px;
        border: 1px solid #3d3d3d;
        border-radius: 12px;
        background: transparent;
        color: #ececec;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.4;
        text-align: left;
      }
      .suggestion:hover { background: #2a2a2a; }
      .msg { margin: 14px 0; }
      .msg.user { display: flex; justify-content: flex-end; }
      .msg.user .bubble {
        max-width: min(70%, 560px);
        margin: 0;
        padding: 8px 14px;
        border-radius: 22px;
        background: #323232;
        line-height: 1.55;
        white-space: pre-wrap;
      }
      .msg.assistant .bubble {
        margin: 0;
        max-width: 100%;
        line-height: 1.65;
        white-space: pre-wrap;
      }
      .msg-actions {
        display: flex;
        gap: 2px;
        margin-top: 6px;
        color: #b4b4b4;
      }
      .msg-actions button {
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 6px;
        background: transparent;
      }
      .msg-actions button:hover { background: #2f2f2f; }
      .msg-actions button.is-on { color: #ececec; background: #2f2f2f; }
      .error { color: #f0a8a4; }
      .composer-wrap { padding: 0 12px 8px; }
      .composer { width: min(100%, 768px); margin: 0 auto; }
      .box {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        padding: 6px 8px 6px 14px;
        border: 1px solid #3d3d3d;
        border-radius: 26px;
        background: #303030;
      }
      .box:focus-within { border-color: #565656; }
      textarea {
        flex: 1;
        min-height: 36px;
        max-height: 160px;
        padding: 8px 0;
        resize: none;
        border: 0;
        background: transparent;
        outline: none;
        line-height: 1.45;
      }
      .send {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        color: #0d0d0d;
      }
      .send:disabled { opacity: .35; cursor: not-allowed; }
      .hint {
        margin: 6px 0 0;
        color: #8f8f8f;
        font-size: 11px;
        text-align: center;
      }
      @media (max-width: 820px) {
        .app { grid-template-columns: 1fr; }
        .sidebar { display: none; }
        .suggestions { grid-template-columns: 1fr; }
        .empty { padding-top: 10vh; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <button class="side-btn new-chat" id="new-chat" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>
        <nav class="side-nav" aria-label="Workspace">
          <a class="side-btn" href="/index.html">Handshake</a>
          <a class="side-btn" href="/recipient.html">Store</a>
        </nav>
        <p class="recents-label">Recents</p>
        <div class="recents" id="recents">
          <button class="recent" type="button" data-thread="allergy-update">AI Passport Allergy Update</button>
          <button class="recent" type="button" data-thread="milk-inquiry">AI Passport Milk Inquiry</button>
          <button class="recent" type="button" data-thread="peanut-info">Peanut Allergy Information</button>
        </div>
        <div class="profile">
          <span class="avatar-sm">G</span>
          <span>Guest<small>Free</small></span>
        </div>
      </aside>
      <div class="stage">
        <header class="topbar">
          <span class="model">NimGTP</span>
          <button class="share" id="share" type="button" aria-label="Copy link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 4v12M8 8l4-4 4 4"/></svg>
          </button>
        </header>
        <div class="thread" id="thread">
          <div class="thread-inner" id="messages">
            <div class="empty" id="empty">
              <h1>How can I help you today?</h1>
              <div class="suggestions">
                <button class="suggestion" type="button" data-prompt="I don't like milk and I can't eat peanuts.">Remember that I don't like milk and I can't eat peanuts.</button>
                <button class="suggestion" type="button" data-prompt="I have a severe peanut allergy.">I have a severe peanut allergy — save that.</button>
                <button class="suggestion" type="button" data-prompt="I'm gluten free and allergic to shellfish.">I'm gluten free and allergic to shellfish.</button>
                <button class="suggestion" type="button" data-prompt="Help me pick a sandwich that is safe for my allergies.">Help me pick a sandwich that is safe for my allergies.</button>
              </div>
            </div>
          </div>
        </div>
        <div class="composer-wrap">
          <div class="composer">
            <form class="box" id="chat-form">
              <textarea id="prompt" rows="1" placeholder="Ask anything" required></textarea>
              <button class="send" id="send" type="submit" aria-label="Send">↑</button>
            </form>
            <p class="hint">NimGTP can make mistakes.</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/chatgpt.js"></script>
  </body>
</html>
